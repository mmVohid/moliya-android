name: APK yig'ish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Debug APK yig'ish
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK'ni artifact sifatida saqlash
        uses: actions/upload-artifact@v4
        with:
          name: Moliya-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Release yaratish (telefondan oson yuklab olish uchun)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Moliya.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Moliya.apk \
            --title "Moliya (so'nggi versiya)" \
            --notes "Debug APK. Telefonda yuklab olib o'rnating. sha:${GITHUB_SHA}"
